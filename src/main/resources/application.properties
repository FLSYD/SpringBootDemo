spring.application.name=SpringBootDemo
server.port=8080
# spring.profiles.active=dev
#控制台日志输出配置
#mybatis 映射文件路径配置

# # 设置日志级别
# logging.level.root=INFO
# logging.level.com.example=DEBUG
# # 设置日志文件路径----排查错误
# logging.file.name=D:/var/logsapp.log
# # 设置日志格式--日志的打印格式
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#数据源配置 springboot默认使用连接池是Hikari (日本一款连接池)
#连接数据库的四大元素
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/mybatis?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# #连接超时时间:毫秒，小于250毫秒，会被重置为默认值30秒
# spring.datasource.hikari.connection-timeout=30000
# #连接最大存活时间.不等于0且小于30秒，会被重置为默认值30分钟.设置应该比mysql设置的超时时间短；单位ms
# spring.datasource.hikari.max-lifetime=1800000
# #最小空闲连接，默认值10，小于0或大于maximum-pool-size，都会重置为maximum-pool-size
# spring.datasource.hikari.minimum-idle=5
# #最大连接数，小于等于0会被重置为默认值10；大于零小于1会被重置为minimum-idle的值
# spring.datasource.hikari.maximum-pool-size=20
# #只有空闲连接数大于最大连接数且空闲时间超过该值，才会被释放
# spring.datasource.hikari.idle-timeout=30000
# #连接测试查询
# spring.datasource.hikari.connection-test-query=select 1 from dual

# spring.datasource.druid.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.druid.url=jdbc:mysql://localhost:3306/mybatis?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.druid.username=root
# spring.datasource.druid.password=${DB_PASSWORD}
# # 池子最开始有的连接数
# spring.datasource.druid.initial-size=5
# # 池子最大的连接数 20
# spring.datasource.druid.max-active=20
# # 池子最小的连接数--建议大家和最初的保持一致
# spring.datasource.druid.min-idle=5
# # 池子最大的等待时间===
# spring.datasource.druid.max-wait=60000

#mybatis-plus配置
mybatis-plus.type-aliases-package=com.example.demo.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Redis连接配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

